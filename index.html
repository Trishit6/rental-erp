<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eceae2" />
    <meta
      name="description"
      content="Rent it for the weekend. Own it for life. Discover a better way to share the things you love with Revaro."
    />
    <title>Revaro — Rent. Buy. Sell. Reuse.</title>
    <script>
      // Apply the persisted theme before first paint to avoid a light-mode flash.
      (function () {
        try {
          var stored = localStorage.getItem("revaro-theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "system";
          var dark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
          }
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Nunito:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
